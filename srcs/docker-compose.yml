services:
    mariadb:
      container_name: mariadb
      networks:
      - inception            			
      build: 
        context: requirements/mariadb 	
        dockerfile: Dockerfile			
      env_file: .env    
      secrets:
        - sql_root_pass
        - sql_pass              
      volumes:                        
      - mariadb:/var/lib/mysql
      restart: unless-stopped         
      expose:                         
      - "3306"

    nginx:
      container_name: nginx
      volumes:
      - wordpress:/var/www/wordpress
      networks:
      - inception
      depends_on:        			 
      - wordpress
      build: 
        context: requirements/nginx
        dockerfile: Dockerfile
      env_file: .env
      ports:
      - "443:443" 	
      restart: on-failure 

    wordpress:
      container_name: wordpress
      env_file: .env
      secrets:
        - sql_pass
        - admin_pass
        - user_pass
      volumes:
      - wordpress:/var/www/wordpress
      networks:
      - inception
      build: 
        context: requirements/wordpress
        dockerfile: Dockerfile
      depends_on:    					
      - mariadb
      restart: on-failure
      expose: 
      - "9000"

volumes:
  wordpress:
    driver: local
    driver_opts:
      type: 'none' 									
      o: 'bind'
      device: '/home/amurtas/data/wordpress' 		
  mariadb:
    driver: local
    driver_opts:
      type: 'none' 
      o: 'bind'										 
      device: '/home/amurtas/data/mariadb'

networks:
  inception:
    driver: bridge

secrets:
  sql_pass:
    file: ./../secrets/sql_password.txt
  sql_root_pass:
    file: ./../secrets/sql_root_password.txt
  admin_pass:
    file: ./../secrets/admin_pass.txt
  user_pass:
    file: ./../secrets/user_pass.txt